apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kafka
resources:
  - kafka.yaml
  - smoke-test.yaml
  - podmonitor.yaml
# Grafana's sidecar loads any ConfigMap labeled grafana_dashboard: "1".
configMapGenerator:
  - name: strimzi-dashboards
    files:
      - dashboards/strimzi-kafka.json
      - dashboards/strimzi-kraft.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true

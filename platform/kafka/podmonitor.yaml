# From Strimzi's examples/metrics/prometheus-install/pod-monitors.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-resources-metrics
spec:
  selector:
    matchExpressions:
      - key: strimzi.io/kind
        operator: In
        values: [Kafka, KafkaConnect, KafkaMirrorMaker2]
  namespaceSelector:
    matchNames: [kafka]
  podMetricsEndpoints:
    - path: /metrics
      port: tcp-prometheus
      # The Strimzi dashboards filter on these labels.
      relabelings:
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(strimzi_io_.+)
          replacement: $1
        # action is explicit because the CRD defaults it, which ArgoCD reports as drift.
        - action: replace
          sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: kubernetes_pod_name
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node_name
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_host_ip]
          targetLabel: node_ip

# Three brokers. Node 0 is also the only KRaft controller: Strimzi can't add controllers to
# an existing cluster, so controller redundancy waits for a fresh install.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  labels:
    strimzi.io/cluster: xenny
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        kraftMetadata: shared
        deleteClaim: false
  # Heap stays well under the pod limit so the JVM isn't OOM-killed.
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  resources:
    requests: {memory: 1Gi, cpu: 250m}
    limits: {memory: 1Gi}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: brokers
  labels:
    strimzi.io/cluster: xenny
spec:
  replicas: 2
  roles: [broker]
  # Same as the dual pool.
  storage:
    type: jbod
    volumes:
      - {id: 0, type: persistent-claim, size: 20Gi, kraftMetadata: shared, deleteClaim: false}
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  resources:
    requests: {memory: 1Gi, cpu: 250m}
    limits: {memory: 1Gi}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: xenny
spec:
  kafka:
    version: 4.3.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # Every partition on all 3 brokers. A write (acks=all) needs 2 copies, so one broker can be down.
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
    metricsConfig:
      type: strimziMetricsReporter
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # Exports consumer group lag; scraped by the PodMonitor in podmonitor.yaml.
  kafkaExporter: {}

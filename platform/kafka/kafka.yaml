# Dev: one node acting as both KRaft controller and broker. Phase 6 grows this to 3.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  labels:
    strimzi.io/cluster: xenny
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        kraftMetadata: shared
        deleteClaim: false
  # Heap stays well under the pod limit so the JVM isn't OOM-killed.
  jvmOptions:
    -Xms: 1g
    -Xmx: 1g
  resources:
    requests: {memory: 2Gi, cpu: 500m}
    limits: {memory: 2Gi}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: xenny
spec:
  kafka:
    version: 4.3.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # Single broker, so everything is replicated once.
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
    metricsConfig:
      type: strimziMetricsReporter
  entityOperator:
    topicOperator: {}
    userOperator: {}

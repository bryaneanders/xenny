apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: connect
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bryaneanders/xenny.git
    targetRevision: main
    path: platform/connect
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # The Strimzi CRDs may not exist yet on a fresh cluster.
      - SkipDryRunOnMissingResource=true
    # Keep retrying until the CRDs arrive.
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

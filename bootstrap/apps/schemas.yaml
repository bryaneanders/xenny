apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: schemas
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bryaneanders/xenny.git
    targetRevision: main
    path: schemas
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # The registry may still be starting on a fresh cluster.
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pipeline-trips
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bryaneanders/xenny.git
    targetRevision: main
    path: pipelines/trips
  destination:
    server: https://kubernetes.default.svc
    namespace: pipelines
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # The Strimzi CRDs may not exist yet on a fresh cluster.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

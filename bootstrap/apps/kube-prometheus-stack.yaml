apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.13.1
    helm:
      valuesObject:
        # k3s runs these inside the server process, so the default scrape targets don't exist.
        kubeControllerManager: {enabled: false}
        kubeScheduler: {enabled: false}
        kubeProxy: {enabled: false}
        kubeEtcd: {enabled: false}
        prometheus:
          prometheusSpec:
            # Pick up monitors and rules from every namespace, not only ones labeled for this release.
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 7d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  resources:
                    requests:
                      storage: 10Gi
        grafana:
          # Created by bootstrap/install.sh, outside git.
          admin:
            existingSecret: grafana-admin
          plugins:
            - grafana-clickhouse-datasource@4.23.4
          # The ClickHouse password, from a Secret created by bootstrap/install.sh.
          envValueFrom:
            CLICKHOUSE_PASSWORD:
              secretKeyRef: {name: clickhouse-grafana, key: password}
          additionalDataSources:
            - name: ClickHouse
              uid: clickhouse
              type: grafana-clickhouse-datasource
              jsonData:
                host: clickhouse-xenny.warehouse
                port: 9000
                protocol: native
                username: grafana
              secureJsonData:
                password: $CLICKHOUSE_PASSWORD
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus CRDs are too large for client-side apply.
      - ServerSideApply=true

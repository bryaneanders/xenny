# Tests the Maven project and builds, scans and pushes the app images (xenny-ingest, xenny-cleaner,
# xenny-connect). Maven dependencies are downloaded once, by the build job; the image jobs reuse
# its cache offline. On main, each new image's tag is committed to the manifest that deploys it.
name: images

on:
  push:
    branches: [main]
    paths: &paths
      - apps/**
      - schemas/**
      - pom.xml
      - .mvn/**
      - .dockerignore
      - .github/workflows/images.yml
  pull_request:
    paths: *paths

# One run at a time per branch, so deploy commits land in order.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write

jobs:
  # Picks the images whose files changed since the commit their deployed image was built from.
  # Comparing with the deployed commit (not the previous push) means changes from a cancelled
  # or failed run are still picked up by the next one.
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.pick.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        run: |
          # image | Maven module | manifest that deploys it | its own paths
          rows=(
            "xenny-ingest|apps/ingest|pipelines/trips/ingest.yaml|apps/ingest schemas"
            "xenny-cleaner|apps/cleaner|pipelines/trips/cleaner.yaml|apps/cleaner schemas"
            "xenny-connect|apps/connect|platform/connect/connect.yaml|apps/connect"
          )
          shared=(pom.xml .mvn .dockerignore .github/workflows/images.yml)
          picked=()
          for row in "${rows[@]}"; do
            IFS='|' read -r image module deploy paths <<<"$row"
            read -ra own <<<"$paths"
            built=$(sed -n "s|.*$image:sha-\([0-9a-f]*\).*|\1|p" "$deploy")
            if [ -z "$built" ] || ! git cat-file -e "$built^{commit}" 2>/dev/null \
                || ! git diff --quiet "$built" HEAD -- "${own[@]}" "${shared[@]}"; then
              picked+=("$(jq -nc --arg image "$image" --arg module "$module" --arg deploy "$deploy" '$ARGS.named')")
            fi
          done
          images=$(printf '%s\n' "${picked[@]}" | jq -sc .)
          echo "Images to build: $images"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  # Tests every module, and is the only job that downloads Maven dependencies.
  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # When the POMs change, start from the newest earlier cache and download only what's new.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml', '.mvn/maven.config') }}
          restore-keys: maven-
      - name: Test
        run: mvn -B verify

  image:
    needs: [changes, build]
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # The cache the build job just saved: Maven runs offline (-o), so nothing is downloaded again.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml', '.mvn/maven.config') }}
          fail-on-cache-miss: true
      - name: Package
        run: mvn -B -o package -pl ${{ matrix.module }} -am -DskipTests

      # Runs arm64 build steps on the x86 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Build one platform into the local Docker daemon so it can be scanned before pushing.
      - name: Build for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}

      # Pinned to a commit so a re-pointed tag can't change what runs (trivy-action's tags were hijacked in 2026).
      - name: Report HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # Reuses the Trivy install and DB from the step above.
          skip-setup-trivy: true
          cache: "false"

      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<short sha> for every build, latest for main.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          # Mac (arm64) and the Ubuntu box (amd64).
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Point the manifest at the new image; ArgoCD deploys it once this commit lands.
      # Commits made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ matrix.image }}
          DEPLOY: ${{ matrix.deploy }}
        run: |
          tag=sha-${GITHUB_SHA::7}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Edit the latest main, not this run's commit: the other image jobs push deploy commits too.
          for _ in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            sed -i "s|\($IMAGE:\).*|\1$tag|" "$DEPLOY"
            git diff --quiet && exit 0
            git commit -qam "Deploy $IMAGE $tag" && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

# Ingest service image; see image.yml for the steps.
name: ingest

on:
  push:
    branches: [main]
    paths: &paths
      - apps/ingest/**
      - schemas/**
      - pom.xml
      - .github/workflows/ingest.yml
      - .github/workflows/image.yml
  pull_request:
    paths: *paths

# One run at a time per branch, so deploy commits land in order.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: write
      packages: write
    with:
      image: xenny-ingest
      module: apps/ingest
      deploy: pipelines/trips/ingest.yaml

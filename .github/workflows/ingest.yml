# Tests and scans the ingest service on every PR and push; on main, also pushes its image to GHCR.
name: ingest

on:
  push:
    branches: [main]
    paths: &paths
      - apps/ingest/**
      - schemas/**
      - pom.xml
      - .github/workflows/ingest.yml
  pull_request:
    paths: *paths

# One run at a time per branch, so deploy commits land in order.
concurrency: ingest-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test
        run: mvn -B verify -pl apps/ingest -am

      - uses: docker/setup-buildx-action@v4

      # Build one platform into the local Docker daemon so it can be scanned before pushing.
      - name: Build for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/ingest/Dockerfile
          platforms: linux/amd64
          load: true
          tags: xenny-ingest:scan
          cache-from: type=gha

      # Pinned to a commit so a re-pointed tag can't change what runs (trivy-action's tags were hijacked in 2026).
      - name: Report HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: xenny-ingest:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: xenny-ingest:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # Reuses the Trivy install and DB from the step above.
          skip-setup-trivy: true
          cache: "false"

      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<short sha> for every build, latest for main.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/xenny-ingest
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/ingest/Dockerfile
          # Mac (arm64) and the Ubuntu box (amd64).
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Point the Deployment at the new image; ArgoCD deploys it once this commit lands.
      # Commits made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i "s|\(xenny-ingest:\).*|\1sha-${GITHUB_SHA::7}|" pipelines/trips/ingest.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy xenny-ingest sha-${GITHUB_SHA::7}"
          git pull --rebase
          git push
